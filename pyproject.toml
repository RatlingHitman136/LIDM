[project]
name = "lidm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "jupyter>=1.1.1",
    "laya>=0.4.20",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
